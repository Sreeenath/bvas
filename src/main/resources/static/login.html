<!-- src/main/resources/static/login.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVAS - Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 10vh auto;
            padding: 2rem;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .login-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            background: var(--border-color);
            cursor: pointer;
            border-radius: 4px 4px 0 0;
        }
        .tab-btn.active {
            background: white;
            border-bottom: 2px solid var(--primary-color);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>BVAS</h1>
            <p>Bill Verification and Approval System</p>
        </div>
        
        <div class="login-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>
        
        <!-- Login Form -->
        <div id="loginTab" class="tab-content active">
            <div class="card">
                <div class="card-header">Login</div>
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="loginUsername" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="loginPassword" required>
                    </div>
                    <div class="form-group" style="text-align: right; margin-bottom: 1rem;">
                        <a href="#" onclick="showForgotPasswordModal(); return false;" style="color: var(--primary-color); text-decoration: none; font-size: 0.9rem;">
                            Forgot Password?
                        </a>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                </form>
                <div id="loginError" class="alert alert-error d-none mt-2"></div>
            </div>
        </div>
        
        <!-- Register Form -->
        <div id="registerTab" class="tab-content">
            <div class="card">
                <div class="card-header">Vendor Registration</div>
                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="regUsername" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="regPassword" required minlength="8">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="regFullName" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="regEmail">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mobile Number</label>
                        <input type="tel" class="form-control" id="regMobile" pattern="[0-9]{10}">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
                </form>
                <div id="registerError" class="alert alert-error d-none mt-2"></div>
                <div id="registerSuccess" class="alert alert-success d-none mt-2"></div>
            </div>
        </div>
    </div>
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Forgot Password</h2>
                <button class="close" onclick="closeForgotPasswordModal()">&times;</button>
            </div>
            <div id="forgotPasswordSteps">
                <!-- Step 1: Request OTP -->
                <div id="step1RequestOtp">
                    <form id="forgotPasswordForm">
                        <div class="form-group">
                            <label class="form-label">Username or Mobile Number</label>
                            <input type="text" class="form-control" id="forgotUsernameOrMobile" required 
                                   placeholder="Enter your username or mobile number">
                            <small class="text-secondary">OTP will be sent to your registered mobile number</small>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Send OTP</button>
                            <button type="button" class="btn btn-secondary" onclick="closeForgotPasswordModal()">Cancel</button>
                        </div>
                    </form>
                    <div id="forgotPasswordError" class="alert alert-error d-none mt-2"></div>
                    <div id="forgotPasswordSuccess" class="alert alert-success d-none mt-2"></div>
                </div>
                
                <!-- Step 2: Verify OTP and Reset Password -->
                <div id="step2ResetPassword" style="display: none;">
                    <form id="resetPasswordForm">
                        <div class="form-group">
                            <label class="form-label">Enter OTP</label>
                            <input type="text" class="form-control" id="resetOtp" required 
                                   placeholder="Enter 6-digit OTP" maxlength="6" pattern="[0-9]{6}">
                            <small class="text-secondary">Check your mobile for OTP (DUMMY: 123456)</small>
                        </div>
                        <div class="form-group">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPassword" required minlength="8"
                                   placeholder="Enter new password (min 8 characters)">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirmPassword" required minlength="8"
                                   placeholder="Confirm new password">
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Reset Password</button>
                            <button type="button" class="btn btn-secondary" onclick="backToStep1()">Back</button>
                        </div>
                    </form>
                    <div id="resetPasswordError" class="alert alert-error d-none mt-2"></div>
                    <div id="resetPasswordSuccess" class="alert alert-success d-none mt-2"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('.tab-btn:first-child').classList.add('active');
                document.getElementById('loginTab').classList.add('active');
            } else {
                document.querySelector('.tab-btn:last-child').classList.add('active');
                document.getElementById('registerTab').classList.add('active');
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('loginError');
            errorDiv.classList.add('d-none');
            
            try {
                const username = document.getElementById('loginUsername').value;
                const password = document.getElementById('loginPassword').value;
                
                const result = await authAPI.login(username, password);
                
                // Redirect based on role
                const role = result.role;
                if (role === 'VENDOR') {
                    window.location.href = '/vendor-dashboard.html';
                } else if (role === 'DISTRICT_VERIFIER') {
                    window.location.href = '/district-dashboard.html';
                } else if (role === 'HQ_ADMIN') {
                    window.location.href = '/admin-dashboard.html';
                }
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('d-none');
            }
        });
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('registerError');
            const successDiv = document.getElementById('registerSuccess');
            errorDiv.classList.add('d-none');
            successDiv.classList.add('d-none');
            
            try {
                const userData = {
                    username: document.getElementById('regUsername').value,
                    password: document.getElementById('regPassword').value,
                    fullName: document.getElementById('regFullName').value,
                    email: document.getElementById('regEmail').value,
                    mobileNumber: document.getElementById('regMobile').value
                };
                
                const result = await authAPI.register(userData);
                successDiv.textContent = result.message || 'Registration successful! Awaiting approval.';
                successDiv.classList.remove('d-none');
                document.getElementById('registerForm').reset();
                
                setTimeout(() => {
                    switchTab('login');
                }, 2000);
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('d-none');
            }
        });

        let forgotPasswordUsernameOrMobile = '';

    function showForgotPasswordModal() {
        document.getElementById('forgotPasswordModal').style.display = 'block';
        document.getElementById('forgotPasswordForm').reset();
        document.getElementById('resetPasswordForm').reset();
        document.getElementById('step1RequestOtp').style.display = 'block';
        document.getElementById('step2ResetPassword').style.display = 'none';
        document.getElementById('forgotPasswordError').classList.add('d-none');
        document.getElementById('forgotPasswordSuccess').classList.add('d-none');
        document.getElementById('resetPasswordError').classList.add('d-none');
        document.getElementById('resetPasswordSuccess').classList.add('d-none');
    }

    function closeForgotPasswordModal() {
        document.getElementById('forgotPasswordModal').style.display = 'none';
        forgotPasswordUsernameOrMobile = '';
    }

    function backToStep1() {
        document.getElementById('step1RequestOtp').style.display = 'block';
        document.getElementById('step2ResetPassword').style.display = 'none';
        document.getElementById('resetPasswordError').classList.add('d-none');
        document.getElementById('resetPasswordSuccess').classList.add('d-none');
    }

    // Forgot Password Form Submit
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('forgotPasswordError');
        const successDiv = document.getElementById('forgotPasswordSuccess');
        errorDiv.classList.add('d-none');
        successDiv.classList.add('d-none');
        
        try {
            const usernameOrMobile = document.getElementById('forgotUsernameOrMobile').value;
            forgotPasswordUsernameOrMobile = usernameOrMobile;
            
            const result = await authAPI.forgotPassword(usernameOrMobile);
            
            successDiv.textContent = result.message || 'OTP sent successfully!';
            successDiv.classList.remove('d-none');
            
            // Show step 2 after 1 second
            setTimeout(() => {
                document.getElementById('step1RequestOtp').style.display = 'none';
                document.getElementById('step2ResetPassword').style.display = 'block';
            }, 1000);
            
        } catch (error) {
            errorDiv.textContent = error.message || 'Failed to send OTP';
            errorDiv.classList.remove('d-none');
        }
    });

    // Reset Password Form Submit
    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('resetPasswordError');
        const successDiv = document.getElementById('resetPasswordSuccess');
        errorDiv.classList.add('d-none');
        successDiv.classList.add('d-none');
        
        try {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const otp = document.getElementById('resetOtp').value;
            
            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'New password and confirm password do not match';
                errorDiv.classList.remove('d-none');
                return;
            }
            
            const result = await authAPI.resetPassword(
                forgotPasswordUsernameOrMobile,
                otp,
                newPassword,
                confirmPassword
            );
            
            successDiv.textContent = result.message || 'Password reset successfully!';
            successDiv.classList.remove('d-none');
            
            // Close modal and redirect to login after 2 seconds
            setTimeout(() => {
                closeForgotPasswordModal();
                document.getElementById('loginPassword').value = '';
                showAlert('Password reset successfully! Please login with your new password.', 'success');
            }, 2000);
            
        } catch (error) {
            errorDiv.textContent = error.message || 'Failed to reset password';
            errorDiv.classList.remove('d-none');
        }
    });

    // Close modal on outside click
    window.onclick = function(event) {
        const modal = document.getElementById('forgotPasswordModal');
        if (event.target === modal) {
            closeForgotPasswordModal();
        }
    }


    function showAlert(message, type = 'info') {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type}`;
        alertDiv.style.position = 'fixed';
        alertDiv.style.top = '20px';
        alertDiv.style.right = '20px';
        alertDiv.style.zIndex = '9999';
        alertDiv.style.minWidth = '300px';
        alertDiv.textContent = message;
        document.body.appendChild(alertDiv);
        
        setTimeout(() => {
            alertDiv.remove();
        }, 5000);
    }
    </script>
</body>
</html>
