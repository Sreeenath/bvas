spring.application.name=bvas
server.port=8080
server.tomcat.max-part-count=500
# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/bvasdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional
spring.jpa.open-in-view=false


spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true


# JWT
jwt.secret=M2N5K3F3Z0NQeG1pY2lqb09pUWV5Yk4zV3lZZGhFMW5NcW9sRw==
jwt.expiration=86400000

# Dummy OTP
otp.default=123456
otp.expiry.seconds=300


# File Upload Configuration
file.upload.dir=./uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Dummy Aadhaar eSign Configuration (for local development)
aadhaar.esign.dummy.enabled=true

# ePOS Integration (Dummy Mode)
epos.api.url=https://epos.uk.gov.in/api
epos.dummy.enabled=true

# Dummy Email Configuration (for local development)
email.dummy.enabled=true
email.dummy.save-to-file=false
