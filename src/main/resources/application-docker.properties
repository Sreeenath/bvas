# src/main/resources/application-docker.properties
server.tomcat.max-part-count=500
# Override database connection for Docker
spring.datasource.url=jdbc:mysql://mysql:3306/bvasdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File uploads
file.upload.dir=/app/uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# OTP Configuration (for Docker)
otp.default=123456
otp.expiry.seconds=300

# Dummy Services Configuration
aadhaar.esign.dummy.enabled=true
epos.dummy.enabled=true
email.dummy.enabled=true

